<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coinchée">
<meta name="theme-color" content="#0a1420">
<link rel="icon" type="image/png" sizes="32x32"
      href="{{ url_for('static', filename='logo/favicon-32x32.png') }}">
<link rel="icon" type="image/png" sizes="16x16"
      href="{{ url_for('static', filename='logo/favicon-16x16.png') }}">
<link rel="apple-touch-icon" sizes="180x180"
      href="{{ url_for('static', filename='logo/apple-touch-icon.png') }}">
<title>Belote Coinchée</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div id="toast" class="toast hidden"></div>

<!-- ============ ÉCRAN ACCUEIL ============ -->
<section id="screen-home" class="screen">
  <div class="home-card">
    <h1 class="logo">♠ Belote <span>Coinchée</span> ♦</h1>

    <!-- Zone de compte (auth.js) : invisible tant que Supabase n'est pas configuré. -->
    <div id="auth-area" class="auth-area hidden"></div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="join">Rejoindre</button>
      <button class="tab-btn" data-tab="create">Créer un salon</button>
    </div>

    <div id="tab-join" class="tab-panel">
      <label>Ton prénom</label>
      <input id="join-name" type="text" placeholder="Ton prénom" maxlength="20" autocomplete="off">
      <label>Code du salon</label>
      <input id="join-code" type="text" placeholder="ex. K7QM" maxlength="4" autocomplete="off"
             value="{{ prefill_code }}" style="text-transform:uppercase">
      <button id="btn-join" class="btn btn-primary">Rejoindre le salon</button>
    </div>

    <div id="tab-create" class="tab-panel hidden">
      <label>Ton prénom</label>
      <input id="create-name" type="text" placeholder="Ton prénom" maxlength="20" autocomplete="off">
      <button id="btn-create" class="btn btn-primary">Créer un nouveau salon</button>
      <p class="hint">Lance ceci depuis l'ordinateur qui fait tourner le serveur, ou depuis n'importe quel appareil du réseau.</p>
    </div>
  </div>
</section>

<!-- ============ ÉCRAN SALON (LOBBY) ============ -->
<section id="screen-lobby" class="screen hidden">
  <div class="lobby-wrap">
    <div class="lobby-header">
      <div>
        <div class="room-code-label">Code du salon</div>
        <div id="lobby-code" class="room-code">----</div>
      </div>
      <img id="lobby-qr" class="qr" alt="QR code du salon">
    </div>
    <p id="lobby-url" class="hint small"></p>

    <div id="seats" class="seats"></div>

    <div class="lobby-settings">
      <label class="row">
        Score cible
        <select id="target-score">
          <option value="500">500</option>
          <option value="1000" selected>1000</option>
          <option value="1500">1500</option>
          <option value="2000">2000</option>
        </select>
      </label>
      <label class="row checkbox-row">
        <input type="checkbox" id="fill-bots" checked>
        Compléter les sièges vides avec les bots choisis ci-dessous (pour tester seul·e)
      </label>
    </div>

    <button id="btn-start" class="btn btn-primary btn-big">Démarrer la partie</button>
    <button id="btn-leave-lobby" class="btn btn-ghost">Quitter le salon</button>
  </div>

  <div id="bot-info-overlay" class="bot-info-overlay hidden">
    <div class="bot-info-box">
      <img id="bot-info-avatar" class="bot-avatar hidden" width="96" height="96" alt="">
      <h2 id="bot-info-name">🤖</h2>
      <p id="bot-info-engine" class="bot-info-engine"></p>
      <p id="bot-info-author" class="bot-info-author"></p>
      <p id="bot-info-desc"></p>
      <button id="bot-info-close" class="btn btn-primary">OK</button>
    </div>
  </div>
</section>

<!-- ============ MODALE COMPTE (connexion / inscription) ============ -->
<div id="auth-overlay" class="overlay interactive hidden">
  <div class="overlay-box auth-box">
    <h2 id="auth-title">Connexion</h2>

    <div id="auth-tabs" class="auth-tabs">
      <button type="button" class="auth-tab active" data-mode="login">Connexion</button>
      <button type="button" class="auth-tab" data-mode="signup">Créer un compte</button>
    </div>

    <form id="auth-form" novalidate>
      <div id="auth-name-row" class="auth-row hidden">
        <label for="auth-name">Ton prénom</label>
        <input id="auth-name" type="text" maxlength="20" autocomplete="nickname" placeholder="Ton prénom">
      </div>
      <div id="auth-email-row" class="auth-row">
        <label for="auth-email" id="auth-email-label">Email</label>
        <input id="auth-email" type="email" autocomplete="username" autocapitalize="none"
               spellcheck="false" placeholder="toi@exemple.fr">
      </div>
      <div id="auth-password-row" class="auth-row">
        <label for="auth-password" id="auth-password-label">Mot de passe</label>
        <input id="auth-password" type="password" autocomplete="current-password"
               autocapitalize="none" spellcheck="false" placeholder="••••••••">
      </div>

      <p id="auth-error" class="auth-message error hidden"></p>
      <p id="auth-info" class="auth-message info hidden"></p>

      <button id="btn-auth-submit" class="btn btn-primary" type="submit">Se connecter</button>
    </form>

    <button id="btn-auth-forgot" class="btn btn-ghost" type="button">Mot de passe oublié ?</button>
    <button id="btn-auth-close" class="btn btn-ghost" type="button">Continuer en invité</button>
  </div>
</div>

<!-- ============ MODALE HISTORIQUE ============ -->
<div id="history-overlay" class="overlay interactive hidden">
  <div class="overlay-box history-box">
    <h2>Mes parties</h2>
    <div id="history-stats" class="history-stats"></div>
    <div id="history-list" class="history-list"></div>
    <button id="btn-history-close" class="btn btn-primary">Fermer</button>
  </div>
</div>

<!-- ============ ÉCRAN JEU ============ -->
<section id="screen-game" class="screen hidden">

  <div class="topbar">
    <span id="game-code" class="topbar-code"></span>
    <span class="topbar-scores">
      <span class="team-a">A <b id="score-a">0</b></span>
      ·
      <span class="team-b">B <b id="score-b">0</b></span>
      <span class="target">/ <span id="target-display">1000</span></span>
    </span>
  </div>

  <div id="game-table-wrap" class="game-table-wrap">
    <div id="board-panel" class="board-panel">
      <div id="claim-notice" class="claim-notice hidden" role="status">
        <strong id="claim-title"></strong>
        <p id="claim-detail"></p>
        <button id="btn-claim-scores" class="btn btn-primary">Voir les scores</button>
      </div>
      <div class="table-felt">
        <div class="seat-marker" id="seat-marker-0"></div>
        <div class="seat-marker" id="seat-marker-1"></div>
        <div class="seat-marker" id="seat-marker-2"></div>
        <div class="seat-marker" id="seat-marker-3"></div>

        <div class="trick-slot" id="trick-slot-0"></div>
        <div class="trick-slot" id="trick-slot-1"></div>
        <div class="trick-slot" id="trick-slot-2"></div>
        <div class="trick-slot" id="trick-slot-3"></div>



        <div id="trick-pile-a" class="trick-pile trick-pile-a" title="Dernier pli de l'équipe A">
          <div class="trick-pile-card"></div>
          <div><div class="trick-pile-label">Équipe A</div><div id="trick-pile-count-a" class="trick-pile-count">0 plis</div></div>
        </div>
        <div id="trick-pile-b" class="trick-pile trick-pile-b" title="Dernier pli de l'équipe B">
          <div class="trick-pile-card"></div>
          <div><div class="trick-pile-label">Équipe B</div><div id="trick-pile-count-b" class="trick-pile-count">0 plis</div></div>
        </div>
        <div id="last-trick-popup" class="last-trick-popup hidden">
          <div id="last-trick-popup-content"></div>
        </div>
        <div id="bid-controls" class="bid-controls hidden"></div>
        <div id="hand-cards" class="hand-cards"></div>
      </div>
      <div class="info-strip">
        <div id="tricks-info" class="tricks-info"></div>
      </div>
    </div>
    <div id="phone-panel" class="phone-panel hidden">
      <div id="phone-status" class="phone-status"></div>
      <div id="phone-bid-slot"></div>
      <div id="phone-hand-slot"></div>
    </div>
  </div>

  <div id="donne-recap" class="overlay hidden">
    <div class="overlay-box" id="donne-recap-content"></div>
  </div>

  <div id="hand-review" class="overlay interactive hidden" role="dialog" aria-modal="true" aria-labelledby="hand-review-title">
    <div class="overlay-box hand-review-box">
      <div class="hand-review-header">
        <h2 id="hand-review-title">Mains de départ</h2>
        <button id="hand-review-close" class="btn btn-small" type="button">Retour aux scores</button>
      </div>
      <label class="hand-review-picker" for="hand-review-deal">Donne
        <select id="hand-review-deal"></select>
      </label>
      <p id="hand-review-contract"></p>
      <div id="hand-review-table" class="hand-review-table"></div>
    </div>
  </div>

</section>

<script>
  // Clés publiques Supabase (optionnelles) : sans elles, l'app reste 100 % invité.
  // Elles proviennent des variables d'environnement SUPABASE_URL / SUPABASE_ANON_KEY.
  window.BELOTE_SUPABASE = {{ supabase | tojson }};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
<script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
