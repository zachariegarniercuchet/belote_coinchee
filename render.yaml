services:
  - type: web
    name: belote-coinchee
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BELOTE_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGIN
        value: "*"
      # QR code / lien de partage : laisser vide, l'URL est deduite de
      # l'hote de la requete (https://<service>.onrender.com) ; a renseigner
      # seulement pour viser une autre adresse, ex. le front GitHub Pages.
      - key: PUBLIC_BASE_URL
        value: ""
      # Comptes optionnels (voir SUPABASE.md) : laisser vides pour le
      # mode invité pur, puis renseigner dans le tableau de bord Render.
      - key: SUPABASE_URL
        value: ""
      - key: SUPABASE_ANON_KEY
        value: ""
